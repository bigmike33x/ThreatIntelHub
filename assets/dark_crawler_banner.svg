<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dark Crawler — banner</title>
<desc>Repository banner showing the Dark Crawler name with an onion network motif</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0f1a14"/>
    <stop offset="100%" stop-color="#080b0a"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="680" height="200" fill="url(#bg)"/>
<rect width="680" height="200" fill="url(#glow)"/>

<!-- Scanlines -->
<rect width="680" height="200" fill="none"
  style="background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)"/>

<!-- Onion rings (concentric circles, left side) -->
<circle cx="90" cy="100" r="72" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.12"/>
<circle cx="90" cy="100" r="55" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.18"/>
<circle cx="90" cy="100" r="38" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.25"/>
<circle cx="90" cy="100" r="22" fill="none" stroke="#00ff9d" stroke-width="0.8" opacity="0.4"/>
<circle cx="90" cy="100" r="9"  fill="#00ff9d" opacity="0.7"/>

<!-- Node dots on rings -->
<circle cx="90"  cy="28"  r="2.5" fill="#00ff9d" opacity="0.5"/>
<circle cx="155" cy="72"  r="2"   fill="#00c8ff" opacity="0.4"/>
<circle cx="148" cy="135" r="2"   fill="#00ff9d" opacity="0.4"/>
<circle cx="90"  cy="172" r="2.5" fill="#00c8ff" opacity="0.5"/>
<circle cx="32"  cy="140" r="2"   fill="#00ff9d" opacity="0.35"/>
<circle cx="18"  cy="80"  r="2"   fill="#00c8ff" opacity="0.35"/>
<circle cx="52"  cy="45"  r="1.5" fill="#00ff9d" opacity="0.3"/>

<!-- Spider web lines from center to dots -->
<line x1="90" y1="100" x2="90"  y2="28"  stroke="#00ff9d" stroke-width="0.4" opacity="0.2"/>
<line x1="90" y1="100" x2="155" y2="72"  stroke="#00c8ff" stroke-width="0.4" opacity="0.15"/>
<line x1="90" y1="100" x2="148" y2="135" stroke="#00ff9d" stroke-width="0.4" opacity="0.15"/>
<line x1="90" y1="100" x2="90"  y2="172" stroke="#00c8ff" stroke-width="0.4" opacity="0.2"/>
<line x1="90" y1="100" x2="32"  y2="140" stroke="#00ff9d" stroke-width="0.4" opacity="0.12"/>
<line x1="90" y1="100" x2="18"  y2="80"  stroke="#00c8ff" stroke-width="0.4" opacity="0.12"/>

<!-- Horizontal rule accent -->
<line x1="180" y1="100" x2="200" y2="100" stroke="#00ff9d" stroke-width="1" opacity="0.5"/>

<!-- Main title -->
<text x="210" y="88"
  font-family="'Share Tech Mono', 'Courier New', monospace"
  font-size="42" font-weight="700" letter-spacing="4"
  fill="#00ff9d" opacity="0.95">DARK</text>
<text x="210" y="134"
  font-family="'Share Tech Mono', 'Courier New', monospace"
  font-size="42" font-weight="700" letter-spacing="4"
  fill="#ffffff" opacity="0.85">CRAWLER</text>

<!-- Tagline -->
<text x="210" y="158"
  font-family="'Share Tech Mono', 'Courier New', monospace"
  font-size="11" letter-spacing="3"
  fill="#00c8ff" opacity="0.55">TOR NETWORK DISCOVERY &amp; RESEARCH TOOL</text>

<!-- Version / badge -->
<rect x="502" y="155" width="142" height="22" rx="3" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.3"/>
<text x="573" y="170"
  font-family="'Share Tech Mono', 'Courier New', monospace"
  font-size="10" letter-spacing="2" text-anchor="middle"
  fill="#00ff9d" opacity="0.45">PYTHON · SCRAPY · TOR</text>

<!-- Corner brackets -->
<path d="M4 20 L4 4 L20 4"   fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.35"/>
<path d="M660 20 L660 4 L644 4" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.35"/>
<path d="M4 180 L4 196 L20 196" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.35"/>
<path d="M660 180 L660 196 L644 196" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.35"/>
</svg>
