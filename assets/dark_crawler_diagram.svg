<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dark Crawler architecture diagram</title>
<desc>Flowchart showing seed sources, Tor proxy, filtering, and live dashboard output</desc>

<rect width="680" height="420" fill="#080b0f"/>

<!-- ── Section label: SEED SOURCES ── -->
<text x="340" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#3a5060" letter-spacing="3">SEED SOURCES</text>

<!-- Ahmia Index -->
<rect x="50" y="36" width="160" height="52" rx="8" fill="#0d1f18" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="58" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#5DCAA5">Ahmia Index</text>
<text x="130" y="76" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#1D9E75">ahmia.fi/onions</text>

<!-- Ahmia Search -->
<rect x="260" y="36" width="160" height="52" rx="8" fill="#0d1f18" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#5DCAA5">Ahmia Search</text>
<text x="340" y="76" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#1D9E75">20+ search terms</text>

<!-- DarkSearch API -->
<rect x="470" y="36" width="160" height="52" rx="8" fill="#0d1f18" stroke="#0F6E56" stroke-width="1"/>
<text x="550" y="58" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#5DCAA5">DarkSearch API</text>
<text x="550" y="76" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#1D9E75">JSON · 3 pages each</text>

<!-- Arrows seeds → harvester -->
<line x1="130" y1="88" x2="308" y2="148" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>
<line x1="340" y1="88" x2="340" y2="148" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>
<line x1="550" y1="88" x2="372" y2="148" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>

<!-- ── Harvester ── -->
<rect x="210" y="148" width="260" height="52" rx="8" fill="#130f1f" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="170" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#AFA9EC">🧅  .onion Harvester</text>
<text x="340" y="188" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#7F77DD">regex scans all page text</text>

<line x1="340" y1="200" x2="340" y2="228" stroke="#7F77DD" stroke-width="1" marker-end="url(#a)"/>

<!-- ── Tor Proxy ── -->
<rect x="210" y="228" width="260" height="52" rx="8" fill="#111417" stroke="#3a5060" stroke-width="1"/>
<text x="340" y="250" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#b8ccd8">Tor Proxy</text>
<text x="340" y="268" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#3a5060">socks5h://127.0.0.1:9150</text>

<line x1="300" y1="280" x2="200" y2="316" stroke="#3a5060" stroke-width="1" marker-end="url(#a)"/>
<line x1="380" y1="280" x2="480" y2="316" stroke="#3a5060" stroke-width="1" marker-end="url(#a)"/>

<!-- ── Content Filter ── -->
<rect x="50" y="316" width="210" height="52" rx="8" fill="#1a0b0e" stroke="#993C1D" stroke-width="1"/>
<text x="155" y="338" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#F0997B">Content Filter</text>
<text x="155" y="356" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#D85A30">blocks adult · dead · empty</text>

<!-- ── Deduplicator ── -->
<rect x="420" y="316" width="210" height="52" rx="8" fill="#0e1a0b" stroke="#3B6D11" stroke-width="1"/>
<text x="525" y="338" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="bold" fill="#97C459">Deduplicator</text>
<text x="525" y="356" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#639922">skips visited hosts</text>

<!-- Arrows filters → dashboard -->
<line x1="155" y1="368" x2="268" y2="390" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/>
<line x1="525" y1="368" x2="412" y2="390" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/>

<!-- ── Live Dashboard ── -->
<rect x="190" y="370" width="300" height="44" rx="8" fill="#181208" stroke="#BA7517" stroke-width="1.5"/>
<text x="340" y="388" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#EF9F27">Live Dashboard</text>
<text x="340" y="405" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#BA7517">results.jsonl · browser UI · search</text>

<!-- Discovery loop -->
<text x="628" y="240" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#3a5060">↻ new links</text>
<text x="628" y="253" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#3a5060">re-queued</text>
<path d="M598 262 Q648 292 598 330" fill="none" stroke="#3a5060" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#a)"/>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
</svg>
